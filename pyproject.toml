[project]
name = "dotgroup-test-2"
version = "0.1.0"
description = "Python programming assistant: LangChain (LCEL) + OpenAI chat models + LangSmith tracing."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "José Eduardo Gontijo de Carvalho", email = "joseduardogontijo@gmail.com" }]
dependencies = [
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langsmith>=0.4",
    "openai>=1.60",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
pychat = "python_chatbot.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.poetry]
packages = [{ include = "python_chatbot", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RET", "RUF",
    "S", "PL", "PERF", "TCH", "ARG", "ERA", "D", "ANN", "T20", "DTZ", "PGH",
]
ignore = ["D203", "D213", "PLR0913", "B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN401", "S106"]
"tests/fakes.py" = ["ARG002"]
"tests/integration/test_openai_wire.py" = ["N802", "A002", "ARG002"]
"src/python_chatbot/cli/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["python_chatbot"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not live",
    "--cov=python_chatbot",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
markers = [
    "live: calls the real OpenAI API; needs OPENAI_API_KEY and costs money",
    "integration: real HTTP client against a local OpenAI-compatible server (no key needed)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["python_chatbot"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
