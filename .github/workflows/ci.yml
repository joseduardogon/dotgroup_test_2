name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install poetry==2.3.2
      - run: poetry install
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run mypy
      - run: poetry run pytest --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dotgroup-test-2:ci .
      - name: Smoke test the image (no secrets available in CI)
        run: |
          docker run --rm --read-only dotgroup-test-2:ci --version
          set +e
          docker run --rm --read-only dotgroup-test-2:ci check
          test $? -eq 2
